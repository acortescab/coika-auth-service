[project]
name = "codename-rats-auth-service"
version = "0.1.0"
description = "Authentication and user session service for the codename_rats platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"alembic",
	"bcrypt",
	"cryptography",
	"fastapi",
	"httpx",
	"pydantic[email]",
	"pydantic-settings",
	"PyJWT",
	"python-dotenv",
	"psycopg[binary]",
	"slowapi",
	"sqlalchemy",
	"uvicorn",
	"opentelemetry-sdk>=1.45.1",
	"opentelemetry-exporter-otlp>=1.45.1",
	"opentelemetry-instrumentation-fastapi>=0.66b1",
	"opentelemetry-instrumentation-sqlalchemy>=0.66b1",
	"opentelemetry-instrumentation-logging>=0.66b1",
	"greenlet>=3.5.6",
]

[dependency-groups]
dev = [
	"pytest",
	"pytest-asyncio",
	"pytest-cov",
	"ruff",
]

[tool.ruff]
line-length = 135
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/db/models/__init__.py" = ["F401"]
